[package]
name = "amphi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.5", features = ["derive"] }
globset = "0.4.21"
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.38", features = ["serde"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
octocrab = "0.54.6"
prometheus-client = "0.25.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "migrate",
  "json",
  "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
aws-lc-rs = "1.19.0"
tempfile = "3.27.0"
